<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>CivicPulse – Smart City Civic Issue Reporting & Resolution System</title>
    <meta name="description" content="Official Smart City Municipal Portal for citizen civic issue reporting, GIS spatial tracking, AI image classification, and automated government dispatch." />
    <meta name="keywords" content="smart city, civic issues, pothole reporting, municipal governance, GIS map, public services, urban management" />
    <meta name="theme-color" content="#111827" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('civicpulse_theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://civicpulse.smartcity.gov" />
    <meta property="og:title" content="CivicPulse – Smart City Civic Issue Reporting System" />
    <meta property="og:description" content="Report civic complaints, track repair progress on GIS maps, and receive real-time municipal alerts." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="CivicPulse – Smart City Civic Portal" />
    <meta property="twitter:description" content="Smart City Municipal Portal for transparent issue reporting & rapid resolution." />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/><path d='m9 12 2 2 4-4'/></svg>" />

    <!-- Structured Data (Schema.org GovernmentService) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GovernmentService",
        "name": "CivicPulse Municipal Service",
        "serviceType": "Civic Issue Reporting & Resolution",
        "provider": {
          "@type": "GovernmentOrganization",
          "name": "Smart City Municipal Corporation"
        },
        "areaServed": "Metropolitan City Wards"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
